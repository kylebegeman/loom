# Fork-owned (Loom); upstream T3 Code never creates loom-*.yml workflows.
#
# Once a day, merge the newest upstream nightly on integrate/<tag>. Conflicts are
# resolved one file per Claude session (loom.sh integrate --resolve), so days that
# pile up never exhaust one session. Then the fork's checks run; Claude repairs a
# failing check on the same branch, and a separate Claude session reviews any
# resolution or repair. With the repository variable LOOM_AUTO_MERGE set to
# "true", a pull request that passed, and passed review when it needed one,
# merges and main is tagged loom-<tag>. Anything else alerts Kyle in Loom
# (LOOM_ALERT_WEBHOOK_URL), and loom-upstream-watch.yml alerts when main falls
# behind anyway. See FORK.md, "Updating from upstream".
name: Loom upstream

on:
  schedule:
    # 11:17 UTC is early morning in New York. Minute zero is GitHub's busiest.
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "nightly, stable, or an upstream tag such as v0.0.43"
        required: true
        default: nightly
        type: string
      dry_run:
        description: "Merge and check only: push nothing, open no pull request"
        required: false
        default: false
        type: boolean

concurrency:
  group: loom-upstream
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    # One day of upstream often conflicts in 60 files; six sessions at a time resolve
    # that in under an hour, before the checks and the review.
    timeout-minutes: 240
    env:
      # Pushes and pull requests use the fork's own token: the built-in token
      # cannot push the upstream workflow changes that most merges carry.
      GH_TOKEN: ${{ secrets.LOOM_BOT_TOKEN }}
      # gh treats a remote named "upstream" as the default repository; pin it
      # to the fork so pull requests and comments never land on pingdotgg/t3code.
      GH_REPO: ${{ github.repository }}
      TARGET: ${{ inputs.target || 'nightly' }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      # Upstream's workflows release, deploy and run on paid runners; none of
      # them belongs to the fork. Merges can add new ones, so every run turns
      # off any workflow that is not a loom-*.yml.
      - name: Keep upstream workflows disabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow list --repo "$GITHUB_REPOSITORY" --all --json id,path,state \
            --jq '.[] | select(.state == "active" and (.path | startswith(".github/workflows/")) and (.path | startswith(".github/workflows/loom-") | not)) | "\(.id) \(.path)"' |
            while read -r id path; do
              echo "Disabling $path"
              gh workflow disable "$id" --repo "$GITHUB_REPOSITORY"
            done

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.LOOM_BOT_TOKEN }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      # loom.sh uses pnpm (the exact version package.json pins) and the Claude CLI.
      - name: Install pnpm and Claude
        run: npm install -g "$(node -p "require('./package.json').packageManager")" @anthropic-ai/claude-code

      - name: Prepare git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/pingdotgg/t3code.git

      - name: Merge, resolve and check
        id: integrate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LOOM_RESOLVE_JOBS: "6"
        run: |
          set +e
          export LOOM_RESOLVE_LOGS="$RUNNER_TEMP/resolve"
          args=("$TARGET" --pr --resolve)
          [ "$DRY_RUN" = true ] && args+=(--dry-run)
          scripts/fork/loom.sh integrate "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/integrate.log"
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> "$GITHUB_OUTPUT"
          if grep -q '^==> Resolving ' "$RUNNER_TEMP/integrate.log"; then
            echo "resolved=true" >> "$GITHUB_OUTPUT"
          fi

      # Code 2 is a conflict a session could not resolve; Claude cannot do better with
      # the whole merge. Any other failure is a check on a committed merge.
      - name: Repair checks with Claude
        id: repair
        if: steps.integrate.outputs.code != '0' && steps.integrate.outputs.code != '2' && startsWith(steps.integrate.outputs.branch, 'integrate/') && env.DRY_RUN != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.LOOM_BOT_TOKEN }}
          claude_args: >-
            --model claude-opus-5-5 --effort high --max-turns 150
            --allowedTools Bash,Read,Edit,Write,Glob,Grep
          prompt: |
            You are repairing an automated upstream merge in Loom, Kyle's additive fork of
            T3 Code (pingdotgg/t3code). Read AGENTS.md, FORK.md and
            docs/fork/packets/CONVENTIONS.md before changing anything.

            `scripts/fork/loom.sh integrate ${{ env.TARGET }} --pr --resolve` committed the merge
            on branch `${{ steps.integrate.outputs.branch }}`, then a check failed (exit code
            ${{ steps.integrate.outputs.code }}): the seams in docs/fork/seams.tsv, the brand
            copy, fork lint, the fork's tests, the web build or a typecheck. Its output is in
            $RUNNER_TEMP/integrate.log.

            Rules:
            - Upstream's code wins everywhere except fork seams: the lines marked
              `fork: <name>` and the rows of docs/fork/seams.tsv. Reapply each seam onto
              upstream's new code and keep its marker.
            - Change only seam lines and fork-owned files (any */fork/* path, scripts/fork/,
              docs/fork/, FORK.md, .github/workflows/loom-*). When a seam moves, update
              docs/fork/seams.tsv and FORK.md with it. Never rewrite, reformat or delete
              upstream code to make a check pass.
            - If the failure comes from upstream itself or from the runner (network,
              install, memory), do not work around it; report it.
            - Never commit pnpm-lock.yaml changes beyond the merge's, and never touch main.

            Commit each fix with a message like `fix(fork): reapply the brand seam in
            SidebarChrome`, then run `scripts/fork/loom.sh integrate --continue --pr`. It reruns
            every check, pushes the branch and opens the pull request; a separate review runs
            after you. If you cannot make the checks pass within these rules, stop and write
            what fails, what you tried and what you recommend to $RUNNER_TEMP/repair-report.md.
            Do not open a pull request yourself.

      # A resolution or repair merges unattended only after an independent session checks
      # it. The verdict and its findings go on the pull request either way.
      - name: Review the resolution
        id: review
        if: (steps.integrate.outputs.resolved == 'true' || steps.repair.outcome == 'success') && env.DRY_RUN != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BRANCH: ${{ steps.integrate.outputs.branch }}
        run: |
          export LOOM_RESOLVE_LOGS="$RUNNER_TEMP/resolve"
          [ -n "$(gh pr list --head "$BRANCH" --state open --json isDraft --jq '.[] | select(.isDraft | not) | 1')" ] || exit 0
          if scripts/fork/loom.sh review-integration; then verdict=pass; else verdict=fail; fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          {
            echo "Review of the unattended resolution: **$verdict**."
            echo
            cat "$LOOM_RESOLVE_LOGS/summary.md" 2>/dev/null && echo
            cat "$LOOM_RESOLVE_LOGS/review.md"
          } > "$RUNNER_TEMP/review-comment.md"
          gh pr comment "$BRANCH" --body-file "$RUNNER_TEMP/review-comment.md"

      # On when the repository variable LOOM_AUTO_MERGE is "true". It tags the merge
      # loom-<tag> as land would, so builds of main carry the upstream version it now
      # contains, and the publisher releases it.
      - name: Merge automatically
        id: merge
        if: vars.LOOM_AUTO_MERGE == 'true' && startsWith(steps.integrate.outputs.branch, 'integrate/') && env.DRY_RUN != 'true' && (steps.integrate.outputs.code == '0' || steps.repair.outcome == 'success') && (steps.review.outputs.verdict == 'pass' || (steps.integrate.outputs.resolved != 'true' && steps.repair.outcome != 'success'))
        env:
          BRANCH: ${{ steps.integrate.outputs.branch }}
        run: |
          [ -n "$(gh pr list --head "$BRANCH" --state open --json isDraft --jq '.[] | select(.isDraft | not) | 1')" ] || exit 1
          scripts/fork/loom.sh merge-integration "$BRANCH"
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Keep the resolution logs
        if: always() && env.DRY_RUN != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: resolve-logs
          path: ${{ runner.temp }}/resolve
          if-no-files-found: ignore
          retention-days: 14

      # Whatever did not merge alerts Kyle in Loom. A merge that stopped leaves no pull
      # request, so open a draft marked "needs Kyle" with the reports; the next
      # integration that contains its tag closes it (loom.sh close_superseded).
      - name: Result
        if: always()
        env:
          CODE: ${{ steps.integrate.outputs.code }}
          BRANCH: ${{ steps.integrate.outputs.branch }}
          MERGED: ${{ steps.merge.outputs.merged }}
          VERDICT: ${{ steps.review.outputs.verdict }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LOOM_ALERT_WEBHOOK_URL: ${{ secrets.LOOM_ALERT_WEBHOOK_URL }}
        run: |
          [ "$DRY_RUN" = true ] && { [ "$CODE" = 0 ] && exit 0; echo "::error::The dry run failed with exit code $CODE."; exit 1; }
          [ "$MERGED" = true ] && exit 0
          if [[ "$BRANCH" != integrate/* ]]; then
            [ "$CODE" = 0 ] && exit 0
            scripts/fork/loom.sh notify failed || true
            echo "::error::The upstream integration failed before it made a branch. See the Merge, resolve and check log."
            exit 1
          fi
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json isDraft --jq '.[] | select(.isDraft | not) | 1')" ]; then
            scripts/fork/loom.sh notify needs-review || true
            echo "::error::The integration passed its checks but did not merge (review: ${VERDICT:-not run}, LOOM_AUTO_MERGE: ${{ vars.LOOM_AUTO_MERGE }}). Its pull request waits."
            exit 1
          fi
          tag=${BRANCH#integrate/}
          git merge --abort 2>/dev/null || true
          git reset -q
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] &&
            git commit -q --allow-empty -m "chore(fork): upstream $tag needs Kyle"
          # shellcheck disable=SC2016 # backticks are Markdown, not a command
          conflicts=$(sed -n 's/^CONFLICT ([^)]*): Merge conflict in \(.*\)$/- `\1`/p' "$RUNNER_TEMP/integrate.log")
          resolution=$(cat "$RUNNER_TEMP/resolve/summary.md" 2>/dev/null) || true
          report=$(cat "$RUNNER_TEMP/repair-report.md" 2>/dev/null) || true
          body="Upstream T3 Code [$tag](https://github.com/pingdotgg/t3code/releases/tag/$tag) did not merge into Loom unattended (exit code $CODE). [Run log]($RUN_URL); each session's log is in its resolve-logs artifact.
          ${conflicts:+
          Conflicted files:
          $conflicts
          }${resolution:+
          $resolution
          }${report:+
          Claude's repair report:

          $report
          }
          Resolve it on your Mac with \`scripts/fork/loom.sh integrate $tag --resolve\`, or leave it: the next integration that contains this tag closes this draft."
          git push -q -u origin "$BRANCH" &&
            gh pr create --draft --base main --head "$BRANCH" --title "chore(fork): integrate upstream $tag (needs Kyle)" --body "$body" ||
            echo "::error::Could not open the needs-Kyle draft."
          scripts/fork/loom.sh notify failed || true
          echo "::error::The upstream integration needs Kyle."
          exit 1
