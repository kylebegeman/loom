# Fork-owned (Loom); upstream T3 Code never creates loom-*.yml workflows.
#
# Every three hours, when upstream has a nightly that neither main nor an open
# integration pull request holds (loom.sh upstream-due), merge it on
# integrate/<tag>, continuing the open integration pull request instead of
# starting over. Conflicts are resolved one file per Claude session (loom.sh
# integrate --resolve), and git rerere remembers every resolution across runs, so
# a run that stops keeps what it resolved. Then the fork's checks run, and every
# failing check gets its own Claude repair session and commit on the same branch,
# round after round. A separate Claude session reviews any resolution or repair;
# a failed review gets a fix session and one more review. With the repository
# variable LOOM_AUTO_MERGE set to "true", a pull request that passed, and passed
# review when it needed one, merges and main is tagged loom-<tag>. Anything else
# waits for the next nightly, which continues it. loom-upstream-watch.yml alerts
# Kyle when main falls behind anyway. Claude runs on Kyle's pooled accounts
# through Switchboard on Dorothy, reached over the tailnet. See FORK.md,
# "Updating from upstream".
name: Loom upstream

on:
  schedule:
    # Upstream cuts several nightlies a day. Minute zero is GitHub's busiest.
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "nightly, stable, or an upstream tag such as v0.0.43"
        required: true
        default: nightly
        type: string
      dry_run:
        description: "Merge and check only: push nothing, open no pull request"
        required: false
        default: false
        type: boolean

concurrency:
  group: loom-upstream
  cancel-in-progress: false

permissions: {}

jobs:
  # A minute's look, so the three-hourly schedule only spends a runner and Claude on new work.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      due: ${{ steps.due.outputs.due }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none

      - name: Decide whether upstream has new work
        id: due
        env:
          GH_TOKEN: ${{ github.token }}
          # The upstream remote would otherwise become gh's default repository.
          GH_REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git remote add upstream https://github.com/pingdotgg/t3code.git
          scripts/fork/loom.sh upstream-due | tee -a "$GITHUB_OUTPUT"

  integrate:
    needs: plan
    if: needs.plan.outputs.due == 'true'
    # Upstream's CI image, so a new runner image cannot fail checks that pass upstream.
    runs-on: ubuntu-24.04
    # A large catch-up conflicts in 60 files; six sessions at a time resolve that in under
    # half an hour. Repair rounds and the review take the rest, inside GitHub's six-hour
    # limit for hosted runners (see LOOM_REPAIR_DEADLINE below).
    timeout-minutes: 350
    permissions:
      contents: read
      actions: write
      # Tailscale exchanges the job's OIDC token for an ephemeral tag:servers node.
      id-token: write
    env:
      # Pushes and pull requests use the fork's own token: the built-in token
      # cannot push the upstream workflow changes that most merges carry.
      GH_TOKEN: ${{ secrets.LOOM_BOT_TOKEN }}
      # gh treats a remote named "upstream" as the default repository; pin it
      # to the fork so pull requests and comments never land on pingdotgg/t3code.
      GH_REPO: ${{ github.repository }}
      TARGET: ${{ inputs.target || 'nightly' }}
      DRY_RUN: ${{ inputs.dry_run || false }}
      ANTHROPIC_BASE_URL: http://dorothy.tail1dab34.ts.net:8317
      # Telemetry and update checks would carry the gateway key to api.anthropic.com.
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      # No repair or review-fix session starts after this, leaving one more session, a final
      # pass of the checks and a review inside timeout-minutes. What is left continues next run.
      - name: Set the session deadline
        run: echo "LOOM_REPAIR_DEADLINE=$(($(date +%s) + 220 * 60))" >> "$GITHUB_ENV"

      # Upstream's workflows release, deploy and run on paid runners; none of
      # them belongs to the fork. Merges can add new ones, so every run turns
      # off any workflow that is not a loom-*.yml.
      - name: Keep upstream workflows disabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow list --repo "$GITHUB_REPOSITORY" --all --json id,path,state \
            --jq '.[] | select(.state == "active" and (.path | startswith(".github/workflows/")) and (.path | startswith(".github/workflows/loom-") | not)) | "\(.id) \(.path)"' |
            while read -r id path; do
              echo "Disabling $path"
              gh workflow disable "$id" --repo "$GITHUB_REPOSITORY"
            done

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.LOOM_BOT_TOKEN }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      # The Vault mail fixture the fork's tests run needs Python 3.13; ubuntu-24.04 ships 3.12.
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # loom.sh uses pnpm (the exact version package.json pins) and the Claude CLI.
      - name: Install pnpm and Claude
        run: npm install -g "$(node -p "require('./package.json').packageManager")" @anthropic-ai/claude-code

      # The check boots the built web client in headless Chromium, which needs Linux libraries
      # the runner lacks. loom.sh installs the browser itself; this only adds the libraries.
      - name: Install Chromium system libraries
        run: npx -y "playwright@$(node -p "require('./apps/web/package.json').devDependencies.playwright")" install-deps chromium

      - name: Prepare git
        run: |
          # Global, so the git repositories tests create get an author too.
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Not --global: the git repositories tests create must not reuse resolutions.
          git config rerere.enabled true
          git remote add upstream https://github.com/pingdotgg/t3code.git

      # Every resolution earlier runs recorded, so a merge that stopped resumes where it left off.
      - name: Restore conflict resolutions
        uses: actions/cache/restore@v6
        with:
          path: .git/rr-cache
          key: loom-rerere-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: loom-rerere-

      - name: Join the tailnet
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:servers

      # One token count proves the tailnet route and the key before any session starts,
      # instead of every resolve session failing on its own.
      - name: Check Switchboard
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.SWITCHBOARD_CI_KEY }}
        run: |
          if ! curl -fsS -o /dev/null --retry 4 --retry-all-errors --retry-delay 3 --max-time 30 \
            -X POST "$ANTHROPIC_BASE_URL/v1/messages/count_tokens" \
            -H "authorization: Bearer $ANTHROPIC_AUTH_TOKEN" -H 'anthropic-version: 2023-06-01' -H 'content-type: application/json' \
            -d '{"model":"claude-opus-5-5","messages":[{"role":"user","content":"ping"}]}'; then
            echo "::error::Switchboard at $ANTHROPIC_BASE_URL did not accept a token count, so Claude cannot run. Check the tailnet join above, SWITCHBOARD_CI_KEY and the gateway on Dorothy."
            exit 1
          fi

      - name: Merge, resolve and check
        id: integrate
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.SWITCHBOARD_CI_KEY }}
          LOOM_RESOLVE_JOBS: "6"
        run: |
          set +e
          export LOOM_RESOLVE_LOGS="$RUNNER_TEMP/resolve"
          args=("$TARGET" --pr --resolve)
          [ "$DRY_RUN" = true ] && args+=(--dry-run)
          scripts/fork/loom.sh integrate "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/integrate.log"
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> "$GITHUB_OUTPUT"
          # A continued draft carries an earlier day's resolution, which no review has passed.
          if grep -qE '^==> (Resolving|Continuing) ' "$RUNNER_TEMP/integrate.log"; then
            echo "resolved=true" >> "$GITHUB_OUTPUT"
          fi
          if grep -q '^==> Repair round ' "$RUNNER_TEMP/integrate.log"; then
            echo "repaired=true" >> "$GITHUB_OUTPUT"
          fi

      # A resolution or repair merges unattended only after an independent session checks
      # it. A failed review gets a fix session, the checks again and a fresh review (--fix).
      # The verdict and its findings go on the pull request either way.
      - name: Review the resolution
        id: review
        if: steps.integrate.outputs.code == '0' && (steps.integrate.outputs.resolved == 'true' || steps.integrate.outputs.repaired == 'true') && env.DRY_RUN != 'true'
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.SWITCHBOARD_CI_KEY }}
          BRANCH: ${{ steps.integrate.outputs.branch }}
        run: |
          export LOOM_RESOLVE_LOGS="$RUNNER_TEMP/resolve"
          [ -n "$(gh pr list --head "$BRANCH" --state open --json isDraft --jq '.[] | select(.isDraft | not) | 1')" ] || exit 0
          if scripts/fork/loom.sh review-integration --fix; then verdict=pass; else verdict=fail; fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          {
            echo "Review of the unattended resolution: **$verdict**."
            echo
            cat "$LOOM_RESOLVE_LOGS/summary.md" 2>/dev/null && echo
            cat "$LOOM_RESOLVE_LOGS/repair.md" 2>/dev/null && echo
            if [ -s "$LOOM_RESOLVE_LOGS/review-fix.md" ]; then
              echo "Earlier reviews failed; a session fixed their findings:"
              echo
              cat "$LOOM_RESOLVE_LOGS/review-fix.md"
              echo
            fi
            cat "$LOOM_RESOLVE_LOGS/review.md"
          } > "$RUNNER_TEMP/review-comment.md"
          gh pr comment "$BRANCH" --body-file "$RUNNER_TEMP/review-comment.md"

      # On when the repository variable LOOM_AUTO_MERGE is "true". It tags the merge
      # loom-<tag> as land would, so builds of main carry the upstream version it now
      # contains, and the publisher releases it.
      - name: Merge automatically
        id: merge
        if: vars.LOOM_AUTO_MERGE == 'true' && startsWith(steps.integrate.outputs.branch, 'integrate/') && env.DRY_RUN != 'true' && steps.integrate.outputs.code == '0' && (steps.review.outputs.verdict == 'pass' || (steps.integrate.outputs.resolved != 'true' && steps.integrate.outputs.repaired != 'true'))
        env:
          BRANCH: ${{ steps.integrate.outputs.branch }}
        run: |
          [ -n "$(gh pr list --head "$BRANCH" --state open --json isDraft --jq '.[] | select(.isDraft | not) | 1')" ] || exit 1
          scripts/fork/loom.sh merge-integration "$BRANCH"
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Keep the resolution logs
        if: always() && env.DRY_RUN != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: resolve-logs
          path: ${{ runner.temp }}/resolve
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep conflict resolutions
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .git/rr-cache
          key: loom-rerere-${{ github.run_id }}-${{ github.run_attempt }}

      # A merge or check that failed leaves no pull request ready to land, so push what it did
      # and open a draft marked "needs Kyle" with the reports, or turn the one this run continued
      # into one. The next nightly's run continues it, and close-superseded closes older ones.
      # A failed run fails here; loom-upstream-watch.yml alerts Kyle once main has waited
      # too long, so a run the next one fixes alerts no one.
      - name: Result
        if: always()
        env:
          CODE: ${{ steps.integrate.outputs.code }}
          BRANCH: ${{ steps.integrate.outputs.branch }}
          MERGED: ${{ steps.merge.outputs.merged }}
          VERDICT: ${{ steps.review.outputs.verdict }}
          AUTO_MERGE: ${{ vars.LOOM_AUTO_MERGE }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            [ "$CODE" = 0 ] && exit 0
            echo "::error::The dry run failed with exit code $CODE."
            exit 1
          fi
          if [ "$MERGED" = true ]; then
            exit 0
          fi
          if [[ "$BRANCH" != integrate/* ]]; then
            if [ "$CODE" = 0 ]; then
              exit 0
            fi
            echo "::error::The upstream integration failed before it made a branch. See the first failed step's log."
            exit 1
          fi
          ready=$(gh pr list --head "$BRANCH" --state open --json isDraft --jq '.[] | select(.isDraft | not) | 1')
          if [ "$CODE" = 0 ] && [ -n "$ready" ]; then
            # A review's last fix round can fail its checks before it pushes; keep it for the next run.
            if [ -n "$(git rev-list "origin/$BRANCH..HEAD" 2>/dev/null)" ]; then
              git push -q origin "HEAD:$BRANCH" || echo "::error::Could not push the review's last fixes."
            fi
            echo "::error::The integration passed its checks but did not merge (review: ${VERDICT:-not run}, LOOM_AUTO_MERGE: ${AUTO_MERGE:-unset}). Its pull request waits, and the next nightly's run continues it."
            exit 1
          fi
          tag=${BRANCH#integrate/}
          git merge --abort 2>/dev/null || true
          git reset -q
          # Without a merge the branch holds no work, so the next run starts over from main;
          # git rerere gives it back every file this run resolved.
          held=$(git tag -l 'v[0-9]*' --merged HEAD --no-merged origin/main | sed -n 1p)
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            git commit -q --allow-empty -m "chore(fork): upstream $tag needs Kyle"
          fi
          body="$RUNNER_TEMP/needs-kyle.md"
          {
            echo "Upstream T3 Code [$tag](https://github.com/pingdotgg/t3code/releases/tag/$tag) did not merge into Loom unattended (exit code $CODE). [Run log]($RUN_URL); each session's log is in its resolve-logs artifact."
            if grep -q '^CONFLICT ' "$RUNNER_TEMP/integrate.log" 2>/dev/null; then
              printf '\nConflicted files:\n\n'
              # shellcheck disable=SC2016 # backticks are Markdown, not a command
              sed -n 's/^CONFLICT ([^)]*): Merge conflict in \(.*\)$/- `\1`/p' "$RUNNER_TEMP/integrate.log"
            fi
            for report in summary.md repair.md; do
              if [ -s "$RUNNER_TEMP/resolve/$report" ]; then
                echo
                cat "$RUNNER_TEMP/resolve/$report"
              fi
            done
            echo
            if [ -n "$held" ]; then
              echo "The run for upstream's next nightly continues this draft: it merges main and that nightly into it, then repairs what still fails. Push fixes to \`$BRANCH\` and it builds on them, or close this draft to make the next run start over from main. Run the workflow by hand to retry sooner."
            else
              echo "The run for upstream's next nightly starts over from main, reusing every file this run resolved (git rerere), and closes this draft once it holds this tag. Run the workflow by hand to retry sooner."
            fi
          } > "$body"
          draft=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if ! { git push -q -u origin "$BRANCH" &&
            if [ -n "$draft" ]; then
              gh pr edit "$draft" --title "chore(fork): integrate upstream $tag (needs Kyle)" --body-file "$body" &&
                # A ready pull request this run continued and broke is no longer ready to land.
                { [ -z "$ready" ] || gh pr ready "$draft" --undo; }
            else
              gh pr create --draft --base main --head "$BRANCH" --title "chore(fork): integrate upstream $tag (needs Kyle)" --body-file "$body"
            fi &&
            scripts/fork/loom.sh close-superseded; }; then
            echo "::error::Could not open the needs-Kyle draft."
          fi
          echo "::error::The upstream integration needs Kyle."
          exit 1
