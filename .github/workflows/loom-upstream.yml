# Fork-owned (Loom); upstream T3 Code never creates loom-*.yml workflows.
#
# Once a day, merge the newest upstream nightly on integrate/<tag>, continuing an
# open "needs Kyle" draft from an earlier day instead of starting over. Conflicts
# are resolved one file per Claude session (loom.sh integrate --resolve), so days
# that pile up never exhaust one session. Then the fork's checks run, and every
# failing check gets its own Claude repair session and commit on the same branch,
# round after round. A separate Claude session reviews any resolution or repair. With the repository
# variable LOOM_AUTO_MERGE set to "true", a pull request that passed, and passed
# review when it needed one, merges and main is tagged loom-<tag>. Anything else
# alerts Kyle in Loom (LOOM_ALERT_WEBHOOK_URL) from a last step that runs whatever
# broke before it, and loom-upstream-watch.yml alerts when main falls behind
# anyway. See FORK.md, "Updating from upstream".
name: Loom upstream

on:
  schedule:
    # 11:17 UTC is early morning in New York. Minute zero is GitHub's busiest.
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "nightly, stable, or an upstream tag such as v0.0.43"
        required: true
        default: nightly
        type: string
      dry_run:
        description: "Merge and check only: push nothing, open no pull request"
        required: false
        default: false
        type: boolean

concurrency:
  group: loom-upstream
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  integrate:
    # Upstream's CI image, so a new runner image cannot fail checks that pass upstream.
    runs-on: ubuntu-24.04
    # One day of upstream often conflicts in 60 files; six sessions at a time resolve
    # that in under half an hour. Repair rounds and the review take the rest, inside
    # GitHub's six-hour limit for hosted runners (see LOOM_REPAIR_DEADLINE below).
    timeout-minutes: 350
    env:
      # Pushes and pull requests use the fork's own token: the built-in token
      # cannot push the upstream workflow changes that most merges carry.
      GH_TOKEN: ${{ secrets.LOOM_BOT_TOKEN }}
      # gh treats a remote named "upstream" as the default repository; pin it
      # to the fork so pull requests and comments never land on pingdotgg/t3code.
      GH_REPO: ${{ github.repository }}
      TARGET: ${{ inputs.target || 'nightly' }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      # Upstream's workflows release, deploy and run on paid runners; none of
      # them belongs to the fork. Merges can add new ones, so every run turns
      # off any workflow that is not a loom-*.yml.
      - name: Keep upstream workflows disabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow list --repo "$GITHUB_REPOSITORY" --all --json id,path,state \
            --jq '.[] | select(.state == "active" and (.path | startswith(".github/workflows/")) and (.path | startswith(".github/workflows/loom-") | not)) | "\(.id) \(.path)"' |
            while read -r id path; do
              echo "Disabling $path"
              gh workflow disable "$id" --repo "$GITHUB_REPOSITORY"
            done

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.LOOM_BOT_TOKEN }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      # The Vault mail fixture the fork's tests run needs Python 3.13; ubuntu-24.04 ships 3.12.
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # loom.sh uses pnpm (the exact version package.json pins) and the Claude CLI.
      - name: Install pnpm and Claude
        run: npm install -g "$(node -p "require('./package.json').packageManager")" @anthropic-ai/claude-code

      - name: Prepare git
        run: |
          # Global, so the git repositories tests create get an author too.
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/pingdotgg/t3code.git

      - name: Merge, resolve and check
        id: integrate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LOOM_RESOLVE_JOBS: "6"
        run: |
          set +e
          export LOOM_RESOLVE_LOGS="$RUNNER_TEMP/resolve"
          # No repair session starts after this, leaving one more session, a final pass of
          # the checks and the review inside timeout-minutes. What is left continues tomorrow.
          export LOOM_REPAIR_DEADLINE=$(($(date +%s) + 260 * 60))
          args=("$TARGET" --pr --resolve)
          [ "$DRY_RUN" = true ] && args+=(--dry-run)
          scripts/fork/loom.sh integrate "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/integrate.log"
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> "$GITHUB_OUTPUT"
          # A continued draft carries an earlier day's resolution, which no review has passed.
          if grep -qE '^==> (Resolving|Continuing) ' "$RUNNER_TEMP/integrate.log"; then
            echo "resolved=true" >> "$GITHUB_OUTPUT"
          fi
          if grep -q '^==> Repair round ' "$RUNNER_TEMP/integrate.log"; then
            echo "repaired=true" >> "$GITHUB_OUTPUT"
          fi

      # A resolution or repair merges unattended only after an independent session checks
      # it. The verdict and its findings go on the pull request either way.
      - name: Review the resolution
        id: review
        if: steps.integrate.outputs.code == '0' && (steps.integrate.outputs.resolved == 'true' || steps.integrate.outputs.repaired == 'true') && env.DRY_RUN != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BRANCH: ${{ steps.integrate.outputs.branch }}
        run: |
          export LOOM_RESOLVE_LOGS="$RUNNER_TEMP/resolve"
          [ -n "$(gh pr list --head "$BRANCH" --state open --json isDraft --jq '.[] | select(.isDraft | not) | 1')" ] || exit 0
          if scripts/fork/loom.sh review-integration; then verdict=pass; else verdict=fail; fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          {
            echo "Review of the unattended resolution: **$verdict**."
            echo
            cat "$LOOM_RESOLVE_LOGS/summary.md" 2>/dev/null && echo
            cat "$LOOM_RESOLVE_LOGS/repair.md" 2>/dev/null && echo
            cat "$LOOM_RESOLVE_LOGS/review.md"
          } > "$RUNNER_TEMP/review-comment.md"
          gh pr comment "$BRANCH" --body-file "$RUNNER_TEMP/review-comment.md"

      # On when the repository variable LOOM_AUTO_MERGE is "true". It tags the merge
      # loom-<tag> as land would, so builds of main carry the upstream version it now
      # contains, and the publisher releases it.
      - name: Merge automatically
        id: merge
        if: vars.LOOM_AUTO_MERGE == 'true' && startsWith(steps.integrate.outputs.branch, 'integrate/') && env.DRY_RUN != 'true' && steps.integrate.outputs.code == '0' && (steps.review.outputs.verdict == 'pass' || (steps.integrate.outputs.resolved != 'true' && steps.integrate.outputs.repaired != 'true'))
        env:
          BRANCH: ${{ steps.integrate.outputs.branch }}
        run: |
          [ -n "$(gh pr list --head "$BRANCH" --state open --json isDraft --jq '.[] | select(.isDraft | not) | 1')" ] || exit 1
          scripts/fork/loom.sh merge-integration "$BRANCH"
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Keep the resolution logs
        if: always() && env.DRY_RUN != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: resolve-logs
          path: ${{ runner.temp }}/resolve
          if-no-files-found: ignore
          retention-days: 14

      # Decide the outcome first, so the alert below knows it even if opening the draft
      # breaks. A merge that stopped leaves no pull request, so push what it did and open
      # a draft marked "needs Kyle" with the reports, or update the one this run continued.
      # The next run continues that draft, and close-superseded closes older ones it holds.
      - name: Result
        id: result
        if: always()
        env:
          CODE: ${{ steps.integrate.outputs.code }}
          BRANCH: ${{ steps.integrate.outputs.branch }}
          MERGED: ${{ steps.merge.outputs.merged }}
          VERDICT: ${{ steps.review.outputs.verdict }}
          AUTO_MERGE: ${{ vars.LOOM_AUTO_MERGE }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            echo "status=dry-run" >> "$GITHUB_OUTPUT"
            [ "$CODE" = 0 ] && exit 0
            echo "::error::The dry run failed with exit code $CODE."
            exit 1
          fi
          if [ "$MERGED" = true ]; then
            echo "status=merged" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$BRANCH" != integrate/* ]]; then
            if [ "$CODE" = 0 ]; then
              echo "status=none" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "::error::The upstream integration failed before it made a branch. See the Merge, resolve and check log."
            exit 1
          fi
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json isDraft --jq '.[] | select(.isDraft | not) | 1')" ]; then
            echo "status=needs-review" >> "$GITHUB_OUTPUT"
            echo "::error::The integration passed its checks but did not merge (review: ${VERDICT:-not run}, LOOM_AUTO_MERGE: ${AUTO_MERGE:-unset}). Its pull request waits."
            exit 1
          fi
          echo "status=failed" >> "$GITHUB_OUTPUT"
          tag=${BRANCH#integrate/}
          git merge --abort 2>/dev/null || true
          git reset -q
          # Without a merge the branch holds no work, so the next run starts over from main.
          held=$(git tag -l 'v[0-9]*' --merged HEAD --no-merged origin/main | sed -n 1p)
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            git commit -q --allow-empty -m "chore(fork): upstream $tag needs Kyle"
          fi
          body="$RUNNER_TEMP/needs-kyle.md"
          {
            echo "Upstream T3 Code [$tag](https://github.com/pingdotgg/t3code/releases/tag/$tag) did not merge into Loom unattended (exit code $CODE). [Run log]($RUN_URL); each session's log is in its resolve-logs artifact."
            if grep -q '^CONFLICT ' "$RUNNER_TEMP/integrate.log" 2>/dev/null; then
              printf '\nConflicted files:\n\n'
              # shellcheck disable=SC2016 # backticks are Markdown, not a command
              sed -n 's/^CONFLICT ([^)]*): Merge conflict in \(.*\)$/- `\1`/p' "$RUNNER_TEMP/integrate.log"
            fi
            for report in summary.md repair.md; do
              if [ -s "$RUNNER_TEMP/resolve/$report" ]; then
                echo
                cat "$RUNNER_TEMP/resolve/$report"
              fi
            done
            echo
            if [ -n "$held" ]; then
              echo "The next daily run continues this draft: it merges main and the newest nightly into it, then repairs what still fails. Push fixes to \`$BRANCH\` and it builds on them, or close this draft to make the next run start over from main."
            else
              echo "Resolve it on your Mac with \`scripts/fork/loom.sh integrate $tag --resolve\`, or leave it: the next run starts over from main and closes this draft once it holds this tag."
            fi
          } > "$body"
          draft=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if ! { git push -q -u origin "$BRANCH" &&
            if [ -n "$draft" ]; then
              gh pr edit "$draft" --title "chore(fork): integrate upstream $tag (needs Kyle)" --body-file "$body"
            else
              gh pr create --draft --base main --head "$BRANCH" --title "chore(fork): integrate upstream $tag (needs Kyle)" --body-file "$body"
            fi &&
            scripts/fork/loom.sh close-superseded; }; then
            echo "::error::Could not open the needs-Kyle draft."
          fi
          echo "::error::The upstream integration needs Kyle."
          exit 1

      # Alerts Kyle in Loom for anything that did not merge. It runs whatever failed before
      # it, including a checkout or a Result step that broke before setting a status (that
      # counts as failed), so it sends the doorbell itself instead of using loom.sh notify.
      - name: Alert Kyle
        if: always() && env.DRY_RUN != 'true'
        env:
          STATUS: ${{ steps.result.outputs.status }}
          LOOM_ALERT_WEBHOOK_URL: ${{ secrets.LOOM_ALERT_WEBHOOK_URL }}
        run: |
          case "${STATUS:-failed}" in
            merged | none) exit 0 ;;
            needs-review) status=needs-review ;;
            *) status=failed ;;
          esac
          if [ -z "$LOOM_ALERT_WEBHOOK_URL" ]; then
            echo "::error::LOOM_ALERT_WEBHOOK_URL is not set, so Loom was not alerted ($status)."
            exit 1
          fi
          printf '{"source":"loom-upstream","status":"%s","run":"%s"}' "$status" "$GITHUB_RUN_ID" |
            curl -fsS --retry 3 -X POST -H 'content-type: application/json' --data-binary @- \
              "$LOOM_ALERT_WEBHOOK_URL" >/dev/null
          echo "Alerted Loom: $status."
