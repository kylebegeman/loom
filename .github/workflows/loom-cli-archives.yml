# Fork-owned exact-source runtimes. The Mac publisher waits before publishing its draft.
name: Loom computer runtimes
run-name: Loom runtimes ${{ inputs.version }} ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact reserved Loom release version
        required: true
      source_sha:
        description: Exact checked source commit
        required: true
      request_id:
        description: Publisher attempt identity
        required: true
      mac_runtime_sha256:
        description: SHA256 of the Mac archive built and smoke-tested by the local publisher; empty builds on a hosted Mac
        required: false
      clerk_publishable_key:
        description: Public Clerk application identifier
        required: false
      clerk_jwt_template:
        description: Public Clerk JWT template name
        required: false
      clerk_cli_oauth_client_id:
        description: Public CLI OAuth application identifier
        required: false
      relay_url:
        description: Public Connect relay URL
        required: false
      connect_retired:
        description: 1 when the publisher retired T3 Connect for this release
        required: false

concurrency:
  group: loom-runtimes-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  LOOM_RUNTIME_VERSION: ${{ inputs.version }}
  LOOM_RUNTIME_SOURCE_SHA: ${{ inputs.source_sha }}
  T3CODE_CLERK_PUBLISHABLE_KEY: ${{ inputs.clerk_publishable_key }}
  T3CODE_CLERK_JWT_TEMPLATE: ${{ inputs.clerk_jwt_template }}
  T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ inputs.clerk_cli_oauth_client_id }}
  T3CODE_RELAY_URL: ${{ inputs.relay_url }}
  # apps/server/vite.config.ts bakes the retired flag only for the exact value 1.
  LOOM_CONNECT_RETIRED: ${{ inputs.connect_retired }}

jobs:
  build:
    if: github.repository == 'kylebegeman/loom'
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.mac_runtime_sha256 != '' && '["linux-arm64","linux-x64"]' || '["darwin-arm64","linux-arm64","linux-x64"]') }}
    runs-on: ${{ fromJSON('{"darwin-arm64":"macos-15","linux-arm64":"ubuntu-24.04-arm","linux-x64":"ubuntu-24.04"}')[matrix.target] }}
    env:
      LOOM_RUNTIME_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The version tag does not exist until the publisher publishes the draft.
          ref: ${{ inputs.source_sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      # build-exe embeds the runner's own Node and refuses any version but engines.node.
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --frozen-lockfile
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: Build and smoke-test the exact source runtime
        shell: bash
        run: node scripts/fork/runtime-build.ts --version "$LOOM_RUNTIME_VERSION" --source-sha "$LOOM_RUNTIME_SOURCE_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: loom-runtime-${{ matrix.target }}
          path: release-cli/*.tar.gz
          if-no-files-found: error
          retention-days: 3

  attach:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: loom-runtime-*
          merge-multiple: true
          path: release-cli
      - name: Attach only to the reserved draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LOOM_MAC_RUNTIME_SHA256: ${{ inputs.mac_runtime_sha256 }}
        run: |
          set -euo pipefail
          test "$(gh release view "$LOOM_RUNTIME_VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true"
          test "$(gh release view "$LOOM_RUNTIME_VERSION" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)" = "$LOOM_RUNTIME_SOURCE_SHA"
          if [ -n "$LOOM_MAC_RUNTIME_SHA256" ]; then
            [[ "$LOOM_MAC_RUNTIME_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
            mac_archive="t3-$LOOM_RUNTIME_VERSION-darwin-arm64.tar.gz"
            gh release download "$LOOM_RUNTIME_VERSION" --repo "$GITHUB_REPOSITORY" --pattern "$mac_archive" --dir release-cli
            printf '%s  %s\n' "$LOOM_MAC_RUNTIME_SHA256" "release-cli/$mac_archive" | sha256sum --check -
          fi
          cd release-cli
          for target in darwin-arm64 linux-arm64 linux-x64; do
            test -f "t3-$LOOM_RUNTIME_VERSION-$target.tar.gz"
          done
          sha256sum -- *.tar.gz > SHA256SUMS
          gh release upload "$LOOM_RUNTIME_VERSION" ./*.tar.gz SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
